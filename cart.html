<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MỘC — Giỏ hàng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/stylehome.css">
<link rel="stylesheet" href="./css/cart-shared.css">
<link rel="stylesheet" href="./css/cart.css">
</head>
<body>

<div class="site">

  <nav class="topbar">
    <a href="home.html" class="logo">MỘC</a>
    <ul class="nav-links">
      <li><a href="home.html">Trang chủ</a></li>
      <li><a href="#">Giảm giá</a></li>
      <li><a href="#">Danh mục</a></li>
      <li><a href="#">Blog</a></li>
      <li><a href="#">Liên hệ</a></li>
    </ul>
    <div class="nav-actions">
      <a href="cart.html" class="cart-link active" aria-label="Giỏ hàng">
        <svg viewBox="0 0 24 24" fill="none" stroke="#211B17" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h2l2.4 11.4a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L21 8H7"/>
          <circle cx="10" cy="20" r="1.3" fill="#211B17"/>
          <circle cx="17" cy="20" r="1.3" fill="#211B17"/>
        </svg>
        <span class="cart-badge" id="cartCount">0</span>
      </a>
      <button class="btn-login" id="loginBtn">Đăng nhập</button>
    </div>
  </nav>

  <header class="cart-head">
    <span class="cart-eyebrow">Bước 1/2</span>
    <h1>Giỏ hàng của bạn</h1>
    <p id="cartItemCountText">0 sản phẩm</p>
  </header>

  <section class="cart-layout">
    <div class="cart-items" id="cartItems"></div>

    <aside class="cart-summary" id="cartSummary">
      <h2>Tóm tắt đơn hàng</h2>
      <div class="summary-row">
        <span>Tạm tính</span>
        <strong id="sumSubtotal">0₫</strong>
      </div>
      <div class="summary-row">
        <span>Phí vận chuyển</span>
        <strong id="sumShipping">Miễn phí</strong>
      </div>
      <div class="cart-divider"></div>
      <div class="summary-row summary-total">
        <span>Tổng cộng</span>
        <strong id="sumTotal">0₫</strong>
      </div>
      <button class="btn-checkout" id="btnCheckout">Tiến hành thanh toán</button>
      <a href="home.html" class="continue-shopping">← Tiếp tục mua sắm</a>
    </aside>
  </section>

</div>

<script src="./js/cart-store.js"></script>
<script src="./js/cart.js"></script>

</body>
</html>
